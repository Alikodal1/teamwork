<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiz - Harcama Takip</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="analiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-wallet"></i>
                <span>Harcama Takip</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="harcamalar.html"><i class="fa-solid fa-list-check"></i> Harcamalar</a></li>
                <li><a href="kategoriler.html"><i class="fa-solid fa-tags"></i> Kategoriler</a></li>
                <li class="active"><a href="analiz.html"><i class="fa-solid fa-pie-chart"></i> Analiz</a></li>
            </ul>
            <button class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</button>
        </nav>

        <main class="content">
            <header class="main-header">
                <h2><i class="fa-solid fa-pie-chart"></i> Analiz</h2>
                <div class="user-info">Merhaba, <span id="activeUsername">Kullanıcı</span>! <i class="fa-solid fa-circle-user"></i></div>
            </header>

            <div class="analiz-layout">
                <!-- Yuvarlak Grafik -->
                <div class="grafik-kart">
                    <h3><i class="fa-solid fa-chart-pie"></i> Kategori Dağılımı</h3>
                    <div class="grafik-wrapper">
                        <canvas id="analizChart"></canvas>
                        <div class="grafik-orta" id="grafikOrta">
                            <span id="grafikToplamTutar">₺ 0</span>
                            <small>Toplam</small>
                        </div>
                    </div>
                    <div class="legend" id="legend"></div>
                </div>

                <!-- Sağ Taraf: Özet Listesi -->
                <div class="ozet-kolon">
                    <div class="ozet-kart">
                        <h3><i class="fa-solid fa-ranking-star"></i> Kategori Sıralaması</h3>
                        <div id="siralamListesi"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/analiz.js"></script>
</body>
</html>
